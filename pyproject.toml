[project]
name = "openarm-flow"
version = "0.2.0"
description = "MeanFlow and FlowPolicy for OpenArm joint action generation from depth observations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    # Recorder files use HDF5 2.0; older h5py builds cannot read them.
    "h5py>=3.16",
    "pyyaml>=6.0",
    "zarr>=2.18,<3",
    "einops>=0.8",
    "termcolor>=2",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
calibration = ["opencv-python-headless>=4.10"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openarm_data", "src/openarm_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120
target-version = "py312"
