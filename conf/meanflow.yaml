# Dual fixed depth cameras, ~100 demonstrations. A starting point, not tuned results.
seed: 42
model:
  horizon: 16
  n_obs_steps: 2
  n_action_steps: 8
  down_dims: [64, 128, 256]
  time_dim: 64
  feature_dim: 96
  state_dim: 64
  delta_actions: true
  flow_ratio: 0.5
  dispersive_weight: 0.01
  depth_noise_std: 0.006  # normalized depth units: ~3 mm for the 0.2-1.2m interval
  pixel_dropout: 0.02
  view_dropout: 0.1
  adaptive_gamma: 0.5
train:
  steps: 20000
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  warmup_steps: 500
  save_every: 1000
  val_samples_per_episode: 64
  num_workers: 0
  max_grad_norm: 1.0
