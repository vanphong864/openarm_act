# Two-depth MeanFlow v2. New training run; v1/FlowPolicy weights are incompatible.
seed: 42
model:
  horizon: 16
  n_obs_steps: 4
  n_action_steps: 4
  down_dims: [64, 128, 256]
  time_dim: 64
  feature_dim: 96
  state_dim: 64
  delta_actions: true
  flow_ratio: 0.5
  dispersive_weight: 0.01
  depth_noise_std: 0.006
  use_rgb: true
  spatial_softmax: true         # keypoint encoder (the old 3x4 average pool blurs positions to several cm)
  keypoints: 32
  rgb_color_jitter: 0.2
  rgb_channel_gain_jitter: 0.1   # white-balance variation (lighting changes during the day)
  state_noise_std: 0.01          # rad, encoder input only
  state_history_dropout: 0.0     # run3/run4 used 0.5: more early gripper closes than run2 (which had none)
  rgb_backbone: resnet18         # ImageNet stem..layer2 + keypoints ("cnn" = small CNN from scratch)
  pretrained_backbone: true
  freeze_backbone_stem: true     # keep ImageNet stem+layer1 (weights and BN stats) fixed
  random_shift_px: 8             # translate each view by up to 8 px (same for depth/RGB/history)
  rgb_cutout_prob: 0.25          # gray out one random rectangle of a view
  rgb_blur_prob: 0.2
  object_features: true          # tin/pad pose + TCP->tin/pad vectors (src/openarm_flow/object_features.py)
  object_dropout: 0.15           # sometimes hide them (as when the scene estimate fails)
  object_noise_m: 0.01           # detector-like position noise
  gripper_state_input: false     # hide the measured opening: run5 only closed once it saw the fingers closing (copycat)
  pixel_dropout: 0.02
  view_dropout: 0.1
  adaptive_gamma: 0.5
  separate_gripper: true
  action_loss_weight: 0.5
  tcp_position_weight: 0.1
  tcp_orientation_weight: 0.02
  gripper_loss_weight: 1.0       # run3/run4 used 2.0: more early gripper closes than run2
  phase_weight: 3.0
  tcp_position_scale_m: 0.03
  tcp_orientation_scale_rad: 0.25
train:
  steps: 12000      # run5: best at 8500, flat after ~10000; best_release keeps the best
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  extra_fraction: 0.3   # share of each batch from --extra-dataset (simulated corrective demos), if given
  save_every: 500
  val_samples_per_episode: 192   # ~900 approach samples: checkpoint choice less driven by noise in the gripper term
  num_workers: 0
  max_grad_norm: 1.0
