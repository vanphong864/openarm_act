# ACT (Zhao et al. 2023) as LeRobot implements it: a CVAE encoder over the
# action chunk at training time, a transformer encoder over [latent, state,
# image tokens], a DETR-style decoder with one query per future step, and an
# L1 + KL loss. The image tokens come from backbone= (DINOv3, DINOv2 or
# ACT's own ResNet). Defaults are LeRobot's / the original paper's.
name: act
# 50 steps at 50 Hz is one second, as act_pipeline. Must match data.fps / the chunk you want.
chunk_size: 50
n_action_steps: 50              # LeRobot's select_action queue; serving returns whole chunks
dim_model: 512
n_heads: 8
dim_feedforward: 3200
feedforward_activation: relu
pre_norm: false
n_encoder_layers: 4
# The original ACT has 7, of which a bug uses only the first; LeRobot keeps 1.
n_decoder_layers: 1
use_vae: true
latent_dim: 32
n_vae_encoder_layers: 4
dropout: 0.1
kl_weight: 10.0
# The image the backbone sees, resized from the camera's frame inside the
# model (training and serving alike). null: the frame's aspect ratio, sized
# to about image_tokens tokens, as many as act_pipeline's ResNet-18 makes of
# 640x480: DINOv3 (16 px patches) 320x240, DINOv2 (14 px) 280x210, ResNet
# (stride 32) 640x480. Or [height, width], multiples of the backbone's stride.
image_size: null
image_tokens: 300
use_amp: false                  # true: mixed precision on CUDA
