# Train (and compute norm stats for) ACT on one dataset:
#   uv run scripts/train.py exp_name=first                       # DINOv3 ViT-B/16, frozen
#   uv run scripts/train.py backbone=dinov2_vitb14 exp_name=first
#   uv run scripts/train.py backbone=resnet18 exp_name=first     # act_pipeline's backbone
#   uv run scripts/train.py backbone=dinov3_vits16 finetune=partial exp_name=first
defaults:
  - paths: default
  - model: act
  - backbone: dinov3_vitb16
  - finetune: frozen
  - data: openarm_rgbd
  - depth_encoder: cnn            # with data.depth_as=branch: cnn | lingbot_depth
  - distill: none                 # none | lingbot_depth (training only)
  - _self_
  - optional experiment: null

# checkpoints/<name>/<exp_name>/checkpoints/<step>/pretrained_model/
name: ${model.name}_${backbone.name}_${finetune.name}${depth_encoder.suffix}${distill.suffix}
exp_name: ${now:%Y%m%d_%H%M%S}

device: auto                    # cuda when there is one, else cpu
seed: 42
batch_size: 32                  # act_pipeline trains with 16, LeRobot's ACT with 8; lower it if memory runs out
num_workers: 4
num_train_steps: 40000          # ~1M samples, as LeRobot's ACT recipe (100k steps x 8)
log_interval: 100
save_interval: 5000             # every checkpoint is kept (~1-2 GB each with the optimizer)
overwrite: false                # wipe checkpoints/<name>/<exp_name> first
resume: false                   # continue from its last checkpoint

# Weights & Biases. The API key comes from .env (WANDB_API_KEY), or from
# `wandb login`. A resumed run continues the same wandb run.
wandb:
  enable: true
  project: openarm_act
  entity: null                  # null: WANDB_ENTITY from .env, else your account's default
  mode: online                  # online | offline (upload later: wandb sync) | disabled
  notes: null
  upload_checkpoints: false     # true: every checkpoint also goes to wandb as an artifact
  # What else goes up, beside the metrics (log_interval) and the config:
  console: false                # the whole console output, progress bars included; the training
                                # log stays on disk anyway (outputs/<script>/<date_time>/)
  system_metrics: true          # GPU/CPU/memory use (GPU memory: is batch_size too big?)
  system_metrics_interval: 60   # seconds between samples (wandb's default: 15)
  save_requirements: false      # the environment's package list (uv.lock pins it)

lr:                             # LeRobot's CosineDecayWithWarmupSchedulerConfig; the backbone's
  warmup_steps: 1000            # group (finetune.lr_backbone) follows the same curve
  peak_lr: 1.0e-4               # act_pipeline's; LeRobot's ACT preset is 1e-5 at batch 8
  decay_steps: ${num_train_steps}
  decay_lr: 1.0e-6
optimizer:                      # LeRobot's AdamWConfig
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4          # ACT's
  grad_clip_norm: 10.0

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${hydra:job.name}/${now:%Y-%m-%d_%H-%M-%S}
