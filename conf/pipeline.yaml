# Data to trained model in one go: fetch the backbone's weights, download what
# is missing, convert unless the dataset already holds exactly these
# episodes, norm stats, train.
#   uv run scripts/train_pipeline.py exp_name=v1
# Every train.yaml option applies (backbone=, finetune=, data=, batch_size=, ...), and
# the data/paths options reach every step alike.
defaults:
  - train
  - _self_

prepare_only: false             # true: everything but the training (backbone, episodes, dataset, norm stats)

download:
  enable: true                  # false: train on what is under paths.raw already
  repo_id: Tuyen062004/data_openarm_8_10
  revision: main                # a branch, tag or commit sha
  folder: null                  # null: the repo's name (data_openarm_8_10)
  patterns: ["*.hdf5"]
  limit: null                   # only the first N episodes (by name)
  max_workers: 4
  check: true                   # open the newly fetched episodes and report problems

convert:
  image_writer_threads: 4
  image_writer_processes: 0
