# The backbone's last blocks train too, at lr_backbone: a ViT's last four
# blocks and its final norm, or ResNet's last stage (backbone=resnet*
# finetune=partial finetune.backbone_last_layers=1). The features adapt to
# the scene while the early, generic layers stay put.
defaults:
  - frozen
  - _self_

name: partial
backbone_trainable: last
backbone_last_layers: 4
