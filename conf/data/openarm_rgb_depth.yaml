# Chest RGB and chest depth as two images: depth goes in as a second, gray
# image (0.2..1.2 m -> 0..1) through the unchanged backbone, which gives it
# tokens of its own. Compare against data=openarm_rgbd, where depth is the
# RGB image's 4th channel.
defaults:
  - openarm_rgb
  - _self_

name: openarm_rgb_depth
cameras: [chest, chest_depth]
