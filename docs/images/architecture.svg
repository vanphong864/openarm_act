<svg width="1260" height="1362" viewBox="0 0 1260 1362" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#000000" />
    </marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background: Solid White -->
  <rect x="0" y="0" width="1260" height="1362" fill="#ffffff"/>

  <!-- Global Styles: data = thin box, frozen = dashed, trained = thick, training only = grey dotted group -->
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.75px; rx: 6px; ry: 6px; }
    .frozen { fill: #ffffff; stroke: #000000; stroke-width: 1.75px; stroke-dasharray: 6 4; rx: 6px; ry: 6px; }
    .trained { fill: #ffffff; stroke: #000000; stroke-width: 3.5px; rx: 6px; ry: 6px; }
    .group { fill: #ffffff; stroke: #000000; stroke-width: 1.5px; stroke-dasharray: 2 4; rx: 10px; ry: 10px; }
    .arrow { stroke: #000000; stroke-width: 1.75px; fill: none; }
    .arrow-grey { stroke: #000000; stroke-width: 1.75px; fill: none; stroke-dasharray: 6 4; }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -0.15px;
    }
    .title { font-size: 18px; font-weight: 700; text-anchor: start; }
    .head { font-weight: 700; }
    .note { font-size: 12.5px; font-weight: 400; }
    .grey { fill: #000000; }
    .left { text-anchor: start; }
  </style>

  <text x="24" y="26" class="title">ACT + DINOv3 ViT-B/16  (backbone=dinov3_vitb16, finetune=frozen, data=openarm_rgbd)</text>

  <!-- Legend -->
  <rect x="24" y="48" width="34" height="18" class="box"/>
  <text x="66" y="57" class="note left">data</text>
  <rect x="130" y="48" width="34" height="18" class="trained"/>
  <text x="172" y="57" class="note left">trained</text>
  <rect x="250" y="48" width="34" height="18" class="frozen"/>
  <text x="292" y="57" class="note left">frozen (pretrained)</text>
  <rect x="430" y="48" width="34" height="18" class="group"/>
  <text x="472" y="57" class="note left">training only</text>
  <text x="600" y="57" class="note left grey">shapes per sample, batch dimension left out; frames 640×480</text>

  <g transform="translate(0, 80)">

    <!-- ==================== TRAINING-ONLY GROUP (right column, centre x=1080) ==================== -->
    <rect x="900" y="0" width="340" height="476" class="group"/>
    <text x="1070" y="16" class="note grey">training only: CVAE encoder</text>

    <!-- ==================== INPUTS ==================== -->
    <rect x="24" y="32" width="170" height="48" class="box"/>
    <text x="109" y="47" class="head">chest RGB</text>
    <text x="109" y="65">uint8 480×640×3</text>

    <rect x="206" y="32" width="170" height="48" class="box"/>
    <text x="291" y="47" class="head">chest depth</text>
    <text x="291" y="65">uint16 480×640, mm</text>

    <rect x="470" y="32" width="180" height="48" class="box"/>
    <text x="560" y="47" class="head">qpos, last 10 at 50 Hz</text>
    <text x="560" y="65">float32 [10, 16], rad / m</text>

    <rect x="940" y="32" width="280" height="48" class="box"/>
    <text x="1080" y="47" class="head">action labels  action[t : t+50]</text>
    <text x="1080" y="65">float32 [50, 16] + pad mask</text>

    <line x1="109" y1="80" x2="109" y2="106" class="arrow" marker-end="url(#arrow)"/>
    <line x1="291" y1="80" x2="291" y2="106" class="arrow" marker-end="url(#arrow)"/>
    <line x1="560" y1="80" x2="560" y2="106" class="arrow" marker-end="url(#arrow)"/>
    <line x1="1080" y1="80" x2="1080" y2="106" class="arrow" marker-end="url(#arrow)"/>

    <!-- ==================== PREPROCESSING ==================== -->
    <rect x="24" y="108" width="170" height="48" class="box"/>
    <text x="109" y="123">÷255 → [3, 480, 640]</text>
    <text x="109" y="141">ImageNet mean / std</text>

    <rect x="206" y="108" width="170" height="48" class="box"/>
    <text x="291" y="123">m, clip 0.2–1.2 m</text>
    <text x="291" y="141">→ 0..1  [1, 480, 640]</text>

    <rect x="470" y="108" width="180" height="48" class="box"/>
    <text x="560" y="123">normalise (mean / std)</text>
    <text x="560" y="141">flatten → [160]</text>

    <rect x="960" y="108" width="240" height="48" class="box"/>
    <text x="1080" y="123">normalise (mean / std)</text>
    <text x="1080" y="141">[50, 16]</text>

    <line x1="109" y1="156" x2="160" y2="182" class="arrow" marker-end="url(#arrow)"/>
    <line x1="291" y1="156" x2="240" y2="182" class="arrow" marker-end="url(#arrow)"/>

    <!-- ==================== VISION (left column, centre x=200) ==================== -->
    <rect x="40" y="184" width="320" height="48" class="box"/>
    <text x="200" y="199">depth stacked as 4th channel  [4, 480, 640]</text>
    <text x="200" y="217">bilinear resize → [4, 240, 320]</text>

    <line x1="200" y1="232" x2="200" y2="258" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="260" width="320" height="48" class="trained"/>
    <text x="200" y="275">patch embedding  Conv2d(4→768, 16×16)</text>
    <text x="200" y="293">RGB pretrained, depth channel init 0</text>

    <line x1="200" y1="308" x2="200" y2="334" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="336" width="320" height="66" class="frozen"/>
    <text x="200" y="352" class="head">DINOv3 ViT-B/16 · 12 blocks · RoPE</text>
    <text x="200" y="370">[CLS + 4 registers + 15×20 patches] × 768</text>
    <text x="200" y="388">final LayerNorm</text>

    <line x1="200" y1="402" x2="200" y2="428" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="430" width="320" height="48" class="box"/>
    <text x="200" y="445">300 patch tokens (CLS, registers dropped)</text>
    <text x="200" y="463">feature map [768, 15, 20]</text>

    <line x1="200" y1="478" x2="200" y2="504" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="506" width="320" height="48" class="trained"/>
    <text x="200" y="521">1×1 conv 768→512</text>
    <text x="200" y="539">+ 2D sinusoidal position</text>

    <line x1="200" y1="554" x2="200" y2="580" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="582" width="320" height="48" class="box"/>
    <text x="200" y="597" class="head">image tokens</text>
    <text x="200" y="615">[300, 512]</text>

    <!-- ==================== STATE (centre x=560) ==================== -->
    <line x1="560" y1="156" x2="560" y2="182" class="arrow" marker-end="url(#arrow)"/>
    <rect x="470" y="184" width="180" height="48" class="trained"/>
    <text x="560" y="199">Linear 160→512</text>
    <text x="560" y="217">state token [1, 512]</text>

    <!-- ==================== LATENT (centre x=770) ==================== -->
    <rect x="680" y="430" width="180" height="48" class="box"/>
    <text x="770" y="445">z = 0  [32]</text>
    <text x="770" y="463">at inference</text>

    <line x1="770" y1="478" x2="770" y2="504" class="arrow" marker-end="url(#arrow)"/>

    <rect x="680" y="506" width="180" height="48" class="trained"/>
    <text x="770" y="521">Linear 32→512</text>
    <text x="770" y="539">latent token [1, 512]</text>

    <!-- ==================== CVAE (training only, centre x=1080) ==================== -->
    <line x1="650" y1="132" x2="928" y2="200" class="arrow-grey" marker-end="url(#arrow-grey)"/>
    <line x1="1080" y1="156" x2="1080" y2="182" class="arrow" marker-end="url(#arrow)"/>

    <rect x="930" y="184" width="300" height="48" class="trained"/>
    <text x="1080" y="199">Linear 160→512 qpos · 16→512 actions</text>
    <text x="1080" y="217">[CLS, qpos, a₀ … a₄₉]  52 × 512</text>

    <line x1="1080" y1="232" x2="1080" y2="258" class="arrow" marker-end="url(#arrow)"/>

    <rect x="960" y="260" width="240" height="48" class="trained"/>
    <text x="1080" y="275">CVAE encoder: 4 layers, 8 heads</text>
    <text x="1080" y="293">sinusoidal positions, pad mask</text>

    <line x1="1080" y1="308" x2="1080" y2="334" class="arrow" marker-end="url(#arrow)"/>

    <rect x="960" y="336" width="240" height="48" class="trained"/>
    <text x="1080" y="351">CLS → Linear 512→64</text>
    <text x="1080" y="369">μ, log σ²  [32] each</text>

    <line x1="1080" y1="384" x2="1080" y2="410" class="arrow" marker-end="url(#arrow)"/>

    <rect x="960" y="412" width="240" height="48" class="box"/>
    <text x="1080" y="427">z = μ + σ·ε  [32]</text>
    <text x="1080" y="445">ε ~ N(0, I)</text>

    <path d="M 960 436 L 884 436 L 884 530 L 862 530" class="arrow-grey" marker-end="url(#arrow-grey)"/>
    <text x="876" y="486" class="note grey" text-anchor="end" style="text-anchor: end">training</text>

    <!-- ==================== ENCODER INPUT ==================== -->
    <line x1="200" y1="630" x2="200" y2="664" class="arrow" marker-end="url(#arrow)"/>
    <line x1="560" y1="232" x2="560" y2="664" class="arrow" marker-end="url(#arrow)"/>
    <line x1="770" y1="554" x2="770" y2="664" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="666" width="1160" height="48" class="box"/>
    <text x="620" y="681" class="head">encoder input: [latent, state, 300 image tokens] = 302 tokens × 512</text>
    <text x="620" y="699">positions: learned (latent, state) + 2D sinusoidal (image)</text>

    <line x1="620" y1="714" x2="620" y2="740" class="arrow" marker-end="url(#arrow)"/>

    <rect x="40" y="742" width="1160" height="48" class="trained"/>
    <text x="620" y="757" class="head">Transformer encoder: 4 layers, 8 heads, d 512, FFN 3200, ReLU, dropout 0.1</text>
    <text x="620" y="775">memory [302, 512]</text>

    <line x1="800" y1="790" x2="800" y2="816" class="arrow" marker-end="url(#arrow)"/>

    <!-- ==================== DECODER ==================== -->
    <rect x="40" y="818" width="320" height="48" class="box"/>
    <text x="200" y="833">50 queries (zeros)</text>
    <text x="200" y="851">+ learned positions [50, 512]</text>

    <line x1="360" y1="842" x2="398" y2="842" class="arrow" marker-end="url(#arrow)"/>

    <rect x="400" y="818" width="800" height="48" class="trained"/>
    <text x="800" y="833" class="head">Transformer decoder: 1 layer, 8 heads</text>
    <text x="800" y="851">self-attention over the 50 queries, cross-attention to the 302 memory tokens</text>

    <line x1="800" y1="866" x2="800" y2="892" class="arrow" marker-end="url(#arrow)"/>

    <rect x="400" y="894" width="800" height="48" class="trained"/>
    <text x="800" y="909">action head Linear 512→16</text>
    <text x="800" y="927">[50, 16], normalised</text>

    <!-- ==================== OUTPUT ==================== -->
    <line x1="600" y1="942" x2="600" y2="968" class="arrow" marker-end="url(#arrow)"/>

    <rect x="400" y="970" width="400" height="48" class="box"/>
    <text x="600" y="985">un-normalise (action mean / std)</text>
    <text x="600" y="1003">+ state on arm joints if data.delta_actions</text>

    <line x1="600" y1="1018" x2="600" y2="1044" class="arrow" marker-end="url(#arrow)"/>

    <rect x="400" y="1046" width="400" height="48" class="box"/>
    <text x="600" y="1061" class="head">actions float32 [50, 16]</text>
    <text x="600" y="1079">absolute joint targets, rad / gripper m; row 0 = now</text>

    <line x1="600" y1="1094" x2="600" y2="1120" class="arrow" marker-end="url(#arrow)"/>

    <rect x="400" y="1122" width="400" height="48" class="box"/>
    <text x="600" y="1137">client clips to OpenArm V1 limits</text>
    <text x="600" y="1155">openarm_act: temporal ensembling, 50 Hz</text>

    <!-- ==================== LOSS (training only) ==================== -->
    <rect x="860" y="958" width="380" height="88" class="group"/>
    <line x1="1000" y1="942" x2="1000" y2="984" class="arrow-grey" marker-end="url(#arrow-grey)"/>
    <text x="1050" y="1000" class="head">loss = L1 + 10 · KL</text>
    <text x="1050" y="1018" class="note">L1(prediction, labels), padded steps masked</text>
    <text x="1050" y="1034" class="note">KL( N(μ, σ²) ‖ N(0, I) )</text>

    <!-- ==================== NOTES ==================== -->
    <text x="24" y="1196" class="note left">Parameters: DINOv3 ViT-B/16 85.9M, frozen but its patch embedding (0.8M, trained at lr 1e-5); ACT 40.6M, trained from scratch at lr 1e-4; 126.5M in all.</text>
    <text x="24" y="1214" class="note left">Other backbones change only the left column: DINOv2 ViT/14 sees 280×210 (15×20 patches of 14 px); ResNet-18 takes 640×480 unresized, conv1(4→64) trained,</text>
    <text x="24" y="1232" class="note left">layer1–4 frozen, layer4 map [512, 15, 20] (act_pipeline's backbone). Always ~300 image tokens. data=openarm_rgb_depth: depth as a second image with its own 300 tokens.</text>
    <text x="24" y="1254" class="note left">Joint states: the last n = model.state_steps at 50 Hz, oldest first (10 in train_overnight.sh; 1 = the current one, Linear 16→512); the robot's openarm_act1 node sends them.</text>
  </g>
</svg>
