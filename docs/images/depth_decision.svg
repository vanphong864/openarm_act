<path d="M 290 216 L 290 268" fill="none" stroke="#000" stroke-width="1.75" marker-end="url(#a)"/>
<text x="312" y="242" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">có</text>
<path d="M 290 326 L 290 368" fill="none" stroke="#000" stroke-width="1.75" marker-end="url(#a)"/>
<path d="M 290 426 L 290 478" fill="none" stroke="#000" stroke-width="1.75" marker-end="url(#a)"/>
<text x="312" y="452" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">có</text>
<path d="M 520 188 L 598 188" fill="none" stroke="#000" stroke-width="1.75" marker-end="url(#a)"/>
<text x="559.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">không</text>
<path d="M 520 398 L 598 398" fill="none" stroke="#000" stroke-width="1.75" marker-end="url(#a)"/>
<text x="559.0" y="386.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">không</text>
