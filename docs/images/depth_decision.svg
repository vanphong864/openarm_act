<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M 0 1 L 8 4.5 L 0 8 Z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="20" y="28" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#000" text-anchor="start" dominant-baseline="central">Quyết định sau từng giai đoạn</text>
<rect x="60" y="60" width="460" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="290.0" y="78.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Giai đoạn 0: R0 (chỉ RGB), R1 (RGB-D hiện tại)</text>
<text x="290.0" y="97.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">R1 ≈ R0 ? dự đoán: có, depth đang không được dùng</text>
<rect x="60" y="160" width="460" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="290.0" y="178.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Giai đoạn 1 + 2: R2 &gt; R0 rõ ?</text>
<text x="290.0" y="197.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">R2 = dữ liệu depth mới + nhánh CNN</text>
<rect x="60" y="270" width="460" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="290.0" y="288.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Giai đoạn 3: chạy R3</text>
<text x="290.0" y="307.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">--lingbot-depth</text>
<rect x="60" y="370" width="460" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="290.0" y="388.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">R3 &gt; R2 rõ và đủ nhanh ?</text>
<text x="290.0" y="407.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">round trip &lt; 20 ms/bước</text>
<rect x="60" y="480" width="460" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="290.0" y="498.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Khuyến nghị luôn bật --lingbot-depth</text>
<text x="290.0" y="517.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">ghi vào README</text>
<rect x="600" y="160" width="380" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="790.0" y="178.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Depth không giúp task này</text>
<text x="790.0" y="197.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">dùng chỉ RGB (cấu hình của R0), DỪNG</text>
<rect x="600" y="370" width="380" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="1.75"/>
<text x="790.0" y="388.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000" text-anchor="middle" dominant-baseline="central">Mặc định R2 (nhánh CNN)</text>
<text x="790.0" y="407.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" dominant-baseline="central">--lingbot-depth vẫn là option</text>
