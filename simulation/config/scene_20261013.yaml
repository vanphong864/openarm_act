# Cảnh MuJoCo cho dataset 2026-10-13 (hai camera chest + front, 46 episode tay trái, 42 tay phải).
# Số liệu hình học/camera/bộ chấp hành ĐO TRÊN DỮ LIỆU — xem simulation/realdata/*.json và docs/SIM_20261013.md.
# File này chỉ ghi những gì dữ liệu không đo được (khối lượng/ma sát vật, màu, phạm vi bàn gỗ ngoài khung hình).
# Sinh XML: simulation/scripts/build_measured_scene.py --config simulation/config/scene_20261013.yaml
kind: measured
robot:
  model: third_party/openarm_mujoco/v1/openarm_bimanual.xml
  base_body: openarm_body_link0

measurements:
  cameras: ../realdata/cameras_20261013.json
  actuators: ../realdata/actuators_20261013.json
  scene: ../realdata/scene_20261013.json
  joint_offsets: ../realdata/joint_offsets_20261013.json   # q_mô_hình = q_encoder + Δ

composite:                           # camera ghép nền (openarm_sim/composite_camera.py)
  dynamic_depth_scale: 1.036        # robot sim gần camera hơn depth thật ~19 mm ở ~0.5 m (scripts/sim_realism.py)
  # Ngoại hình lớp render, đo trên 13 episode val bằng scripts/compare_sim_images.py: màu robot/hộp kẹo thật / sim,
  # độ tương phản robot thật / sim (độ lệch chuẩn) và độ nét quanh robot (sim nét hơn ~1.5x khi chưa làm mờ).
  blur_sigma: 1.2
  color_gains:
    chest: {robot: [0.900, 1.113, 1.148], objects: [1.039, 1.091, 1.220], robot_contrast: 0.84}
    front: {robot: [1.024, 1.031, 0.932], objects: [1.288, 1.041, 1.096], robot_contrast: 0.93}
  # Xác suất mất depth thêm (theo mảng) trên robot (pixel đen → trắng) và hộp kẹo: D435 thật mất chest 52% / front
  # 16% pixel robot, 14% / 2% pixel hộp kẹo; render sạch chỉ mất 40% / 2% (ngoài tầm, mép) và 0%.
  depth_dropout:
    chest: {robot: [0.14, 0.35], objects: 0.14}
    front: {robot: [0.03, 0.38], objects: 0.02}

background_dir: ../realdata          # ảnh nền thật cho camera ghép nền (make_real_backgrounds.py)

table:                               # bàn gỗ đỡ hộp kê; chỉ phần dưới tầm với có ý nghĩa vật lý
  x_range: [-0.30, 1.10]
  y_range: [-0.80, 0.80]
  rgba: [0.62, 0.52, 0.40, 1]
  fallback_support_z: 0.0

box:                                 # null = lấy theo vùng mặt hộp nhìn thấy (scene_*.json: surface)
  # Mép gần x ≈ 0.145: mép trên mặt hộp trong ảnh front, dải y không có robot (điểm x≈0 cùng độ cao là bàn tay/cột).
  # Mép xa x ≈ 0.555: mặt đứng phía trước hộp hiện ở đáy ảnh front. y: vùng nhìn thấy của hai camera.
  # Hộp + ô giấy xê dịch giữa các phiên (±1.5 cm): replay dịch hộp theo ô giấy của từng episode.
  center_xy: [0.350, 0.005]
  size_x: 0.410
  size_y: 0.810
  yaw_deg: 0.0
  rgba: [0.20, 0.23, 0.25, 1]
  friction: [0.8, 0.01, 0.001]

target_pad: {}                       # điền bởi build_measured_scene.py từ scene_*.json (tâm, kích thước, yaw)

objects:
  mentos_tin:                        # khối lượng/ma sát KHÔNG đo được từ dữ liệu
    # dài × rộng × dày (m). Dày 16 mm: depth mặt trên − mặt hộp (hai camera, 281 lần đo). Rộng 44 mm: khe ngón
    # trong model ở độ mở kẹp lúc giữ (22.8 mm tay trái / 24.5 mm tay phải) — encoder kẹp đo đúng chiều bị bóp.
    # Dài 88 mm: dài theo depth (~100 mm) trừ cùng độ phồng mép depth như chiều rộng (~8 mm mỗi phía). ±5 mm.
    size: [0.088, 0.044, 0.016]
    mass: 0.045                      # ước lượng (hộp kẹo Mentos thiếc đầy); effort tay không đủ nhạy để đo
    friction: [0.6, 0.005, 0.0001]
    rgba: [0.077, 0.459, 0.229, 1]   # [0.065, 0.50, 0.30] x màu thật/sim [1.183, 0.917, 0.764] (scripts/sim_realism.py, 2 vòng)
    top_texture: realdata/tin_top.png  # nhãn mặt trên từ ảnh thật (simulation/scripts/make_tin_texture.py)

camera_housings:                     # vỏ D435 có va chạm (tay có thể chạm camera ngực)
  chest: {size: [0.090, 0.025, 0.025]}

task:
  fps: 50
  object: mentos_tin
  # arm, spawn và home_qpos được build_measured_scene.py điền theo phân bố đo được của từng tay
